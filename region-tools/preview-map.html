<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Region map</title>
  <style>
    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      left: 0;
      position: absolute;
      top: 0;
    }

    .leaflet-container {
      background: #d8e2e8;
      overflow: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .leaflet-map-pane { z-index: 400; }
    .leaflet-tile-pane { z-index: 200; }
    .leaflet-overlay-pane { z-index: 400; }
    .leaflet-shadow-pane { z-index: 500; }
    .leaflet-marker-pane { z-index: 600; }
    .leaflet-tooltip-pane { z-index: 650; }
    .leaflet-popup-pane { z-index: 700; }

    .leaflet-tile { filter: inherit; visibility: hidden; }
    .leaflet-tile-loaded { visibility: inherit; }
    .leaflet-zoom-animated { transform-origin: 0 0; }
    .leaflet-interactive { cursor: pointer; }

    .leaflet-control {
      clear: both;
      float: left;
      pointer-events: auto;
      position: relative;
      z-index: 800;
    }

    .leaflet-top,
    .leaflet-bottom {
      pointer-events: none;
      position: absolute;
      z-index: 1000;
    }

    .leaflet-top { top: 0; }
    .leaflet-bottom { bottom: 0; }
    .leaflet-left { left: 0; }
    .leaflet-right { right: 0; }
    .leaflet-top .leaflet-control { margin-top: 10px; }
    .leaflet-bottom .leaflet-control { margin-bottom: 10px; }
    .leaflet-left .leaflet-control { margin-left: 10px; }
    .leaflet-right .leaflet-control { float: right; margin-right: 10px; }

    .leaflet-control-layers,
    .leaflet-bar {
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
    }

    .leaflet-bar a {
      background: #fff;
      border-bottom: 1px solid #ccc;
      color: #000;
      display: block;
      font: bold 20px/34px Arial, Helvetica, sans-serif;
      height: 34px;
      text-align: center;
      text-decoration: none;
      width: 34px;
    }

    .leaflet-control-layers {
      padding: 6px 8px;
      max-width: min(400px, calc(100vw - 24px));
    }

    .leaflet-control-layers-list {
      max-height: min(52vh, 380px);
      overflow: auto;
      overscroll-behavior: contain;
    }

    .leaflet-control-layers-toggle { display: none; }

    .leaflet-control-layers.panel-collapsed {
      max-height: none;
      max-width: none;
      overflow: visible;
      padding: 6px;
      width: auto;
    }

    .leaflet-control-layers.panel-collapsed > *:not(.layer-actions),
    .leaflet-control-layers.panel-collapsed .leaflet-control-layers-list,
    .leaflet-control-layers.panel-collapsed .leaflet-control-layers-overlays,
    .leaflet-control-layers.panel-collapsed .leaflet-control-layers-base,
    .leaflet-control-layers.panel-collapsed .leaflet-control-layers-separator,
    .leaflet-control-layers.panel-collapsed .layer-actions-title,
    .leaflet-control-layers.panel-collapsed .select-action,
    .leaflet-control-layers.panel-collapsed .deselect-action {
      display: none;
    }

    .leaflet-control-layers label {
      display: block;
      font-size: 12px;
      line-height: 1.35;
    }

    .leaflet-control-layers .layer-actions {
      align-items: center;
      border-bottom: 1px solid #d7dee7;
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      padding-bottom: 8px;
    }

    .layer-actions-title {
      color: #1e293b;
      flex: 1;
      font-size: 12px;
      font-weight: 700;
    }

    .leaflet-control-layers.panel-collapsed .layer-actions {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .leaflet-control-layers.panel-collapsed .layer-actions button {
      min-width: 4.25rem;
      width: auto;
    }

    .leaflet-control-layers .layer-actions button {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      color: #1e293b;
      cursor: pointer;
      font: 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 5px 8px;
    }

    .leaflet-control-layers .layer-actions button:hover {
      background: #e2e8f0;
    }

    .leaflet-tooltip {
      background: #fff;
      border: 1px solid #d6e0e7;
      border-radius: 4px;
      box-shadow: 0 1px 3px rgba(15, 35, 48, 0.18);
      color: #16202a;
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 2px 6px;
      pointer-events: none;
      position: absolute;
      white-space: nowrap;
    }

    :root {
      color-scheme: light;
      --ink: #16202a;
      --muted: #526876;
      --line: #d6e0e7;
      --panel: rgba(255, 255, 255, 0.97);
      --code: #0f766e;
      --active: #dff6f2;
      --hot: #e8efff;
    }

    * { box-sizing: border-box; }

    html,
    body,
    #map {
      height: 100%;
      margin: 0;
    }

    body {
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .home-link {
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
      color: #1e293b;
      display: block;
      font: 600 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 8px 10px;
      text-decoration: none;
    }

    .home-link:hover {
      background: #f8fafc;
    }

    .map-title {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 26px rgba(15, 35, 48, 0.16);
      max-width: min(360px, calc(100vw - 24px));
      padding: 10px 12px;
    }

    .map-title h1 {
      font-size: 13px;
      font-weight: 700;
      margin: 0;
    }

    .map-title p {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      margin: 6px 0 0;
    }

    .map-title a {
      color: #0f766e;
    }

    .panel-toggle {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      color: #1e293b;
      cursor: pointer;
      flex: 0 0 auto;
      font: 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-width: 2.25rem;
      padding: 5px 7px;
    }

    .panel-toggle:hover {
      background: #e2e8f0;
    }

    .tree-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 26px rgba(15, 35, 48, 0.16);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: min(58vh, 520px);
      overflow: hidden;
      padding: 10px 12px;
      width: min(360px, calc(100vw - 24px));
    }

    .tree-panel.panel-collapsed {
      max-height: none;
      overflow: visible;
      padding: 6px;
      width: auto;
    }

    .tree-panel.panel-collapsed .tree-panel-body,
    .tree-panel.panel-collapsed .tree-panel-heading {
      display: none;
    }

    .tree-panel-header {
      align-items: center;
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }

    .tree-panel-heading {
      flex: 1;
      font-size: 12px;
      font-weight: 700;
      margin: 0;
    }

    .tree-panel-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .trees {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .tree-card,
    .detail {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.7rem 0.65rem 0.6rem;
    }

    .tree-card h2,
    .detail h2 {
      font-size: 12px;
      margin: 0 0 0.35rem;
    }

    .tree-heading {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      margin: 0.65rem 0.25rem 0.2rem;
    }

    .tree-row {
      align-items: baseline;
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: inherit;
      cursor: pointer;
      display: flex;
      font: inherit;
      gap: 0.5rem;
      line-height: 1.35;
      padding: 0.14rem 0.35rem;
      text-align: left;
      width: 100%;
    }

    .tree-row code {
      color: var(--code);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      font-weight: 750;
      min-width: 3rem;
    }

    .tree-row span {
      font-size: 0.86rem;
    }

    .tree-row:hover,
    .tree-row.is-hot {
      background: var(--hot);
    }

    .tree-row.is-active {
      background: var(--active);
    }

    .swatch {
      border-radius: 999px;
      box-shadow: inset 0 0 0 1px rgba(15, 35, 48, 0.22);
      display: inline-block;
      flex: 0 0 auto;
      height: 0.65rem;
      transform: translateY(0.05rem);
      width: 0.65rem;
    }

    .detail {
      flex: 0 0 auto;
      max-height: 34%;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .detail p,
    .detail li {
      color: var(--muted);
      font-size: 0.84rem;
      margin: 0.3rem 0 0;
    }

    .detail ul {
      margin: 0.35rem 0 0;
      padding-left: 1rem;
    }

    .chain {
      list-style: none;
      margin: 0.4rem 0 0;
      padding: 0;
    }

    .chain li {
      margin: 0;
    }

    .chain code {
      color: var(--code);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 750;
    }

    .region-label {
      background: transparent;
      border: 0;
      pointer-events: none;
    }

    .region-label span {
      color: #102c3b;
      display: block;
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-align: center;
      text-shadow:
        0 0 2px #fff,
        0 0 3px #fff,
        1px 0 0 #fff,
        -1px 0 0 #fff,
        0 1px 0 #fff,
        0 -1px 0 #fff;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .error {
      background: #fff3f0;
      border: 1px solid #e7b2a4;
      border-radius: 10px;
      left: 12px;
      padding: 0.8rem 1rem;
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 1100;
    }

    @media (max-width: 720px) {
      .tree-panel,
      .map-title {
        max-width: min(100vw - 24px, 360px);
        width: min(100vw - 24px, 360px);
      }

      .tree-panel {
        max-height: min(42vh, 360px);
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map", { minZoom: 4, zoomControl: true }).setView([45.5, -120.5], 5);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    const homeLink = L.control({ position: "topleft" });
    homeLink.onAdd = () => {
      const link = L.DomUtil.create("a", "home-link");
      link.href = "/";
      link.textContent = "All regions";
      L.DomEvent.disableClickPropagation(link);
      return link;
    };
    homeLink.addTo(map);

    const titleControl = L.control({ position: "topleft" });
    titleControl.onAdd = () => {
      const div = L.DomUtil.create("div", "map-title");
      div.innerHTML = `
        <h1 class="map-title-heading">Region map</h1>
        <p class="map-title-summary">Loading scopes…</p>
      `;
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    titleControl.addTo(map);

    const overlayControl = L.control.layers(null, null, {
      collapsed: false,
      sortLayers: true,
      position: "topright"
    });
    overlayControl.addTo(map);

    function installLayerActions(layerRecords) {
      const container = overlayControl.getContainer();
      if (!container || container.querySelector(".layer-actions")) return;
      const div = L.DomUtil.create("div", "layer-actions");
      container.insertBefore(div, container.firstChild);
      div.innerHTML = `
        <span class="layer-actions-title">Layers</span>
        <button class="select-action" type="button">Select all</button>
        <button class="deselect-action" type="button">Deselect all</button>
        <button class="panel-toggle" type="button" aria-label="Open layers" aria-expanded="false">Layers</button>
      `;
      const toggle = div.querySelector(".panel-toggle");
      const select = div.querySelector(".select-action");
      const deselect = div.querySelector(".deselect-action");
      container.classList.add("panel-collapsed");
      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.on(toggle, "click", (event) => {
        L.DomEvent.stop(event);
        const collapsed = container.classList.toggle("panel-collapsed");
        toggle.textContent = collapsed ? "Layers" : "Hide layers";
        toggle.setAttribute("aria-label", collapsed ? "Open layers" : "Hide layers");
        toggle.setAttribute("aria-expanded", String(!collapsed));
      });
      L.DomEvent.on(select, "click", (event) => {
        L.DomEvent.stop(event);
        layerRecords.forEach(({ layer }) => {
          if (!map.hasLayer(layer)) map.addLayer(layer);
        });
        refreshLabels();
      });
      L.DomEvent.on(deselect, "click", (event) => {
        L.DomEvent.stop(event);
        layerRecords.forEach(({ layer }) => {
          if (map.hasLayer(layer)) map.removeLayer(layer);
        });
        refreshLabels();
      });
    }

    const treeControl = L.control({ position: "bottomright" });
    treeControl.onAdd = () => {
      const div = L.DomUtil.create("div", "tree-panel");
      div.innerHTML = `
        <div class="tree-panel-header">
          <h2 class="tree-panel-heading">Region tree</h2>
          <button class="panel-toggle" type="button" aria-label="Hide region tree" aria-expanded="true">Hide</button>
        </div>
        <div class="tree-panel-body">
          <div class="trees" id="trees"></div>
          <section class="detail" id="detail"></section>
        </div>
      `;
      const toggle = div.querySelector(".panel-toggle");
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      L.DomEvent.on(toggle, "click", (event) => {
        L.DomEvent.stop(event);
        const collapsed = div.classList.toggle("panel-collapsed");
        toggle.textContent = collapsed ? "Region tree" : "Hide";
        toggle.setAttribute("aria-label", collapsed ? "Open region tree" : "Hide region tree");
        toggle.setAttribute("aria-expanded", String(!collapsed));
      });
      return div;
    };
    treeControl.addTo(map);
    L.DomEvent.disableScrollPropagation(map.getContainer().querySelector(".leaflet-control-container"));

    const highlightLayer = L.geoJSON(null, {
      interactive: false,
      style: { color: "#0f766e", weight: 3.5, opacity: 1, fillColor: "#ffffff", fillOpacity: 0.08 }
    }).addTo(map);
    const labelLayer = L.layerGroup().addTo(map);

    let tree = null;
    let features = [];
    let layerRecords = [];
    let layerById = new Map();
    let lockedId = null;
    let shownId = null;

    function fillStyle(feature) {
      const local = feature.properties.kind === "local";
      return {
        color: "#334155",
        weight: local ? 1.4 : 2,
        opacity: 0.9,
        fillColor: feature.properties.color,
        fillOpacity: local ? 0.28 : 0.16
      };
    }

    function overlayStyle(feature) {
      return {
        color: feature.properties.color,
        weight: 2.2,
        opacity: 0.95,
        dashArray: "7 5",
        fillColor: feature.properties.color,
        fillOpacity: 0.08
      };
    }

    function outlineStyle(feature) {
      return {
        color: feature.properties.color || "#334155",
        weight: feature.properties.kind === "backbone" ? 2.6 : 2.2,
        opacity: 0.9,
        fillOpacity: 0
      };
    }

    function styleFor(feature) {
      const kind = feature.properties.kind;
      if (kind === "overlay") return overlayStyle(feature);
      if (kind === "state" || kind === "backbone") return outlineStyle(feature);
      return fillStyle(feature);
    }

    function defaultVisible(kind) {
      return kind === "region" || kind === "local" || kind === "overlay" || kind === "state" || kind === "campus";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function pointOnSegment(point, a, b) {
      const cross = (point[1] - a[1]) * (b[0] - a[0]) - (point[0] - a[0]) * (b[1] - a[1]);
      if (Math.abs(cross) > 1e-9) return false;
      const dot = (point[0] - a[0]) * (b[0] - a[0]) + (point[1] - a[1]) * (b[1] - a[1]);
      if (dot < 0) return false;
      const lengthSquared = (b[0] - a[0]) ** 2 + (b[1] - a[1]) ** 2;
      return dot <= lengthSquared;
    }

    function pointInRing(point, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const a = ring[i];
        const b = ring[j];
        if (pointOnSegment(point, a, b)) return true;
        const intersects = ((a[1] > point[1]) !== (b[1] > point[1]))
          && (point[0] < ((b[0] - a[0]) * (point[1] - a[1])) / (b[1] - a[1]) + a[0]);
        if (intersects) inside = !inside;
      }
      return inside;
    }

    function pointInPolygon(point, polygon) {
      if (!polygon.length || !pointInRing(point, polygon[0])) return false;
      return !polygon.slice(1).some((hole) => pointInRing(point, hole));
    }

    function pointInGeometry(point, geometry) {
      if (!geometry) return false;
      if (geometry.type === "Polygon") return pointInPolygon(point, geometry.coordinates);
      if (geometry.type === "MultiPolygon") return geometry.coordinates.some((polygon) => pointInPolygon(point, polygon));
      return false;
    }

    function featureById(id) {
      return features.find((item) => item.properties.id === id);
    }

    function layerVisible(id) {
      const layer = layerById.get(id);
      return !!(layer && map.hasLayer(layer));
    }

    function hasLocalChild(id) {
      return Object.values(tree.nodes).some((node) => node.parent === id && node.kind === "local");
    }

    function renderTrees() {
      const host = document.getElementById("trees");
      host.innerHTML = tree.cards.map((card) => `<section class="tree-card" id="card-${escapeHtml(card.id)}"></section>`).join("");
      for (const card of tree.cards) {
        const cardHost = document.getElementById(`card-${card.id}`);
        const rows = card.rows.map((row) => treeButton(row)).join("");
        const extra = card.extraRows
          ? `<p class="tree-heading">${escapeHtml(card.extraHeading)}</p>${card.extraRows.map((row) => treeButton(row)).join("")}`
          : "";
        cardHost.innerHTML = `<h2>${escapeHtml(card.title)}</h2>${rows}${extra}`;
      }
      document.querySelectorAll(".tree-row").forEach((button) => {
        button.addEventListener("mouseenter", () => showHighlight(button.dataset.id));
        button.addEventListener("mouseleave", () => showHighlight(lockedId));
        button.addEventListener("click", () => lockSelection(button.dataset.id, { fit: true }));
      });
    }

    function treeButton(row) {
      const node = tree.nodes[row.id];
      return `<button type="button" class="tree-row" data-id="${escapeHtml(row.id)}" style="padding-left:${8 + row.depth * 14}px">
        <code>${escapeHtml(node.code)}</code>
        <i class="swatch" style="background:${escapeHtml(node.color)}"></i>
        <span>${escapeHtml(node.name)}</span>
      </button>`;
    }

    function renderDetail(id) {
      const host = document.getElementById("detail");
      if (!id || !tree.nodes[id]) {
        host.innerHTML = `
          <h2>How to read the map</h2>
          <p>Click a scope in the tree, or click the map. Use the Layers box to show or hide individual scopes.</p>`;
        return;
      }
      const node = tree.nodes[id];
      const chain = node.chain.map((chainId) => {
        const item = tree.nodes[chainId];
        if (!item) return "";
        return `<li><code>${escapeHtml(item.code)}</code> ${escapeHtml(item.name)}</li>`;
      }).join("");
      const also = (node.also || []).map((alsoId) => {
        const item = tree.nodes[alsoId];
        const code = item ? item.code : alsoId;
        const name = item ? ` ${escapeHtml(item.name)}` : "";
        return `<li>Also carries <code>${escapeHtml(code)}</code>${name}</li>`;
      }).join("");
      const counties = node.counties?.length
        ? `<p>Counties: ${escapeHtml(node.counties.join(", "))}.</p>`
        : "";
      const source = node.source === "pnw"
        ? `<p>Named in the Pacific Northwest hierarchy.</p>`
        : "";
      host.innerHTML = `
        <h2><code style="color:var(--code)">${escapeHtml(node.code)}</code> ${escapeHtml(node.name)}</h2>
        <ul class="chain">${chain}${also}</ul>
        <p>${escapeHtml(node.note)}</p>
        ${counties}
        ${source}`;
    }

    function showHighlight(id) {
      if (id === shownId) return;
      shownId = id;
      highlightLayer.clearLayers();
      document.querySelectorAll(".tree-row").forEach((button) => {
        button.classList.toggle("is-hot", button.dataset.id === id && id !== lockedId);
        button.classList.toggle("is-active", button.dataset.id === lockedId);
      });
      if (!id) return;
      const node = tree.nodes[id];
      const target = node.highlight || id;
      const match = featureById(target);
      if (!match || match.geometry.type === "Point") {
        if (match?.geometry.type === "Point") {
          const [lon, lat] = match.geometry.coordinates;
          highlightLayer.addData({
            type: "Feature",
            properties: {},
            geometry: { type: "Polygon", coordinates: circle(lon, lat, 0.08) }
          });
        }
        return;
      }
      highlightLayer.addData(match);
      highlightLayer.bringToFront();
    }

    function circle(lon, lat, radius) {
      const ring = [];
      for (let i = 0; i <= 32; i += 1) {
        const angle = (i / 32) * Math.PI * 2;
        ring.push([lon + radius * Math.cos(angle), lat + radius * 0.7 * Math.sin(angle)]);
      }
      return [ring];
    }

    function lockSelection(id, { fit = false } = {}) {
      lockedId = id;
      shownId = null;
      showHighlight(id);
      renderDetail(id);
      if (id) history.replaceState(null, "", `#${encodeURIComponent(id)}`);
      if (!fit) return;
      const node = tree.nodes[id];
      const match = featureById(node.highlight || id);
      if (!match) return;
      if (match.geometry.type === "Point") {
        const [lon, lat] = match.geometry.coordinates;
        map.setView([lat, lon], 12);
        return;
      }
      const bounds = L.geoJSON(match).getBounds();
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.18), { animate: true });
    }

    function addLabel(coordinates, code) {
      if (!coordinates) return;
      const [lon, lat] = coordinates;
      L.marker([lat, lon], {
        interactive: false,
        keyboard: false,
        icon: L.divIcon({
          className: "region-label",
          html: `<span>${escapeHtml(code)}</span>`,
          iconSize: [8, 8],
          iconAnchor: [4, 4]
        })
      }).addTo(labelLayer);
    }

    function refreshLabels() {
      labelLayer.clearLayers();
      const detailed = map.getZoom() >= 7;
      features.forEach((item) => {
        const props = item.properties;
        if (!layerVisible(props.id)) return;
        if (props.kind === "region" && !detailed) addLabel(props.label, props.code);
        if (props.kind === "overlay" && detailed) addLabel(props.label, props.code);
        if (!detailed) return;
        if (props.kind === "local") addLabel(props.label, props.code);
        if (props.kind === "region") {
          const localsOn = features.some((candidate) => (
            candidate.properties.kind === "local"
            && tree.nodes[candidate.properties.id]?.parent === props.id
            && layerVisible(candidate.properties.id)
          ));
          if (!localsOn) addLabel(props.label, props.code);
          else if (props.gapLabel) addLabel(props.gapLabel, props.code);
          else if (!hasLocalChild(props.id)) addLabel(props.label, props.code);
        }
      });
    }

    function hitTest(latlng) {
      const point = [latlng.lng, latlng.lat];
      let best = null;
      let bestRank = Infinity;
      features.forEach((item) => {
        const kind = item.properties.kind;
        if (kind === "campus" || kind === "backbone" || kind === "alias") return;
        if (!layerVisible(item.properties.id)) return;
        if (kind === "state") {
          const denserVisible = features.some((candidate) => (
            ["region", "local", "overlay"].includes(candidate.properties.kind)
            && layerVisible(candidate.properties.id)
          ));
          if (denserVisible) return;
        }
        if (!pointInGeometry(point, item.geometry)) return;
        const rank = kind === "local" ? 1 : kind === "region" ? 2 : kind === "overlay" ? 3 : 4;
        const smaller = best && item.properties.area < best.properties.area;
        if (!best || rank < bestRank || (rank === bestRank && smaller)) {
          best = item;
          bestRank = rank;
        }
      });
      return best;
    }

    map.on("mousemove", (event) => {
      if (!tree) return;
      const hit = hitTest(event.latlng);
      showHighlight(hit ? hit.properties.id : lockedId);
    });
    map.on("mouseout", () => {
      if (tree) showHighlight(lockedId);
    });
    map.on("click", (event) => {
      const hit = hitTest(event.latlng);
      if (hit) lockSelection(hit.properties.id);
    });
    map.on("zoomend", () => {
      if (features.length) refreshLabels();
    });
    map.on("overlayadd overlayremove", () => {
      if (features.length) refreshLabels();
    });

    Promise.all([
      fetch("tree.json", { cache: "no-store" }).then((response) => response.json()),
      fetch("regions.geojson", { cache: "no-store" }).then((response) => response.json())
    ]).then(([treeData, geojson]) => {
      tree = treeData;
      document.title = tree.title;
      document.querySelector(".map-title-heading").textContent = tree.title;
      const source = tree.source ? ` <a href="${escapeHtml(tree.source)}">Source hierarchy</a>.` : "";
      document.querySelector(".map-title-summary").innerHTML = `${escapeHtml(tree.summary)}${source}`;
      features = geojson.features;
      layerRecords = [];
      layerById = new Map();

      features.forEach((item) => {
        const props = item.properties;
        let layer;
        if (props.kind === "campus") {
          const [lon, lat] = item.geometry.coordinates;
          layer = L.circleMarker([lat, lon], {
            radius: 6,
            color: "#fff",
            fillColor: props.color,
            fillOpacity: 0.95,
            weight: 2
          }).bindTooltip(`${props.code} campus`, { direction: "right", offset: [8, 0] })
            .on("click", (event) => {
              L.DomEvent.stopPropagation(event);
              lockSelection(props.id, { fit: true });
            });
        } else {
          layer = L.geoJSON(item, {
            interactive: false,
            style: styleFor
          });
        }
        layerById.set(props.id, layer);
        layerRecords.push({ id: props.id, layer, kind: props.kind });
        overlayControl.addOverlay(layer, `${escapeHtml(props.code)} - ${escapeHtml(props.name)}`);
        if (defaultVisible(props.kind)) layer.addTo(map);
      });

      installLayerActions(layerRecords);
      renderTrees();
      renderDetail(null);
      refreshLabels();
      map.invalidateSize();
      const bounds = L.latLngBounds();
      layerRecords.forEach(({ layer }) => {
        if (!map.hasLayer(layer)) return;
        if (typeof layer.getBounds === "function") {
          const layerBounds = layer.getBounds();
          if (layerBounds.isValid()) bounds.extend(layerBounds);
        } else if (typeof layer.getLatLng === "function") {
          bounds.extend(layer.getLatLng());
        }
      });
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.08), { animate: false });
      refreshLabels();
      const focus = decodeURIComponent(window.location.hash.replace(/^#/, ""));
      if (focus && tree.nodes[focus]) lockSelection(focus, { fit: true });
    }).catch((error) => {
      const banner = document.createElement("p");
      banner.className = "error";
      banner.textContent = `Could not load the preview data (${error.message}). Serve this folder over HTTP.`;
      document.body.prepend(banner);
    });
  </script>
</body>
</html>
