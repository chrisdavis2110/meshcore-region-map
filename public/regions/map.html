<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>California MeshCore Region Map</title>
  <meta
    name="description"
    content="Interactive MeshCore region boundaries for California, built from the meshcore-settings region tree."
  >
  <meta property="og:type" content="website">
  <meta property="og:title" content="California MeshCore Region Map">
  <meta
    property="og:description"
    content="Interactive MeshCore region boundaries for California, built from the meshcore-settings region tree."
  >
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="California MeshCore Region Map">
  <meta
    name="twitter:description"
    content="Interactive MeshCore region boundaries for California, built from the meshcore-settings region tree."
  >
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQorGC6w5t2EWPMKdbTNOSpR4T9zD9M="
    crossorigin=""
  >
  <style>
    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      left: 0;
      position: absolute;
      top: 0;
    }

    .leaflet-container {
      background: #d8e2e8;
      overflow: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .leaflet-map-pane {
      z-index: 400;
    }

    .leaflet-tile-pane {
      z-index: 200;
    }

    .leaflet-overlay-pane {
      z-index: 400;
    }

    .leaflet-shadow-pane {
      z-index: 500;
    }

    .leaflet-marker-pane {
      z-index: 600;
    }

    .leaflet-tooltip-pane {
      z-index: 650;
    }

    .leaflet-popup-pane {
      z-index: 700;
    }

    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      user-select: none;
      -webkit-user-drag: none;
    }

    .leaflet-tile {
      filter: inherit;
      visibility: hidden;
    }

    .leaflet-tile-loaded {
      visibility: inherit;
    }

    .leaflet-zoom-animated {
      transform-origin: 0 0;
    }

    .leaflet-interactive {
      cursor: pointer;
    }

    .leaflet-pane > svg path.leaflet-interactive {
      pointer-events: visiblePainted;
    }

    .leaflet-control {
      clear: both;
      float: left;
      pointer-events: auto;
      position: relative;
      z-index: 800;
    }

    .leaflet-top,
    .leaflet-bottom {
      pointer-events: none;
      position: absolute;
      z-index: 1000;
    }

    .leaflet-top {
      top: 0;
    }

    .leaflet-right {
      right: 0;
    }

    .leaflet-bottom {
      bottom: 0;
    }

    .leaflet-left {
      left: 0;
    }

    .leaflet-top .leaflet-control {
      margin-top: 10px;
    }

    .leaflet-bottom .leaflet-control {
      margin-bottom: 10px;
    }

    .leaflet-left .leaflet-control {
      margin-left: 10px;
    }

    .leaflet-right .leaflet-control {
      float: right;
      margin-right: 10px;
    }

    .leaflet-control-layers,
    .leaflet-bar {
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
    }

    .leaflet-bar a {
      background: #fff;
      border-bottom: 1px solid #ccc;
      color: #000;
      display: block;
      font: bold 20px/34px Arial, Helvetica, sans-serif;
      height: 34px;
      text-align: center;
      text-decoration: none;
      width: 34px;
    }

    .leaflet-control-layers {
      padding: 6px 8px;
      max-width: min(400px, calc(100vw - 24px));
    }

    .leaflet-control-layers-list {
      max-height: min(60vh, 420px);
      overflow: auto;
      overscroll-behavior: contain;
    }

    .leaflet-control-layers-toggle { display: none; }

    .leaflet-control-layers.panel-collapsed {
      max-height: none;
      max-width: none;
      overflow: visible;
      padding: 6px;
      width: auto;
    }

    .leaflet-control-layers.panel-collapsed > *:not(.layer-actions),
    .leaflet-control-layers.panel-collapsed .leaflet-control-layers-list,
    .leaflet-control-layers.panel-collapsed .leaflet-control-layers-overlays,
    .leaflet-control-layers.panel-collapsed .leaflet-control-layers-base,
    .leaflet-control-layers.panel-collapsed .leaflet-control-layers-separator,
    .leaflet-control-layers.panel-collapsed .layer-actions-title,
    .leaflet-control-layers.panel-collapsed .deselect-action {
      display: none;
    }

    .leaflet-control-layers label {
      display: block;
      font-size: 12px;
      line-height: 1.35;
    }

    .leaflet-control-layers .layer-actions {
      align-items: center;
      border-bottom: 1px solid #d7dee7;
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      padding-bottom: 8px;
    }

    .layer-actions-title {
      color: #1e293b;
      flex: 1;
      font-size: 12px;
      font-weight: 700;
    }

    .leaflet-control-layers.panel-collapsed .layer-actions {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .leaflet-control-layers.panel-collapsed .layer-actions button {
      min-width: 4.25rem;
      width: auto;
    }

    .leaflet-control-layers .layer-actions button {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      color: #1e293b;
      cursor: pointer;
      font: 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 5px 8px;
    }

    .leaflet-control-layers .layer-actions button:hover {
      background: #e2e8f0;
    }

    .leaflet-popup {
      margin-bottom: 20px;
      position: absolute;
      text-align: center;
    }

    .leaflet-popup-content-wrapper {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.4);
      padding: 1px;
      position: relative;
      text-align: left;
    }

    .leaflet-popup-content {
      line-height: 1.3;
      margin: 13px 19px;
    }
    .leaflet-popup-scrolled { overflow: auto; overscroll-behavior: contain; }

    .leaflet-popup-close-button {
      color: #475569;
      font: 20px/20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 20px;
      position: absolute;
      right: 5px;
      text-align: center;
      text-decoration: none;
      top: 5px;
      width: 20px;
      z-index: 1;
    }

    .leaflet-popup-close-button:hover {
      color: #0f172a;
    }

    html,
    body,
    #map {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .legend {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #d6e0e7;
      border-radius: 12px;
      box-shadow: 0 8px 26px rgba(15, 35, 48, 0.16);
      color: #16202a;
      max-height: min(52vh, 420px);
      overflow: auto;
      overscroll-behavior: contain;
      padding: 10px 12px;
    }

    .legend.panel-collapsed {
      overflow: visible;
      padding: 6px;
    }

    .legend h2 {
      align-items: center;
      background: #fff;
      display: flex;
      font-size: 13px;
      gap: 10px;
      justify-content: space-between;
      margin: 0 0 8px;
      padding-bottom: 6px;
      position: sticky;
      top: -10px;
      z-index: 1;
    }

    .legend.panel-collapsed h2 {
      margin: 0;
      padding-bottom: 0;
    }

    .legend.panel-collapsed h2 [data-map-title] { display: none; }

    .legend.panel-collapsed #legendRows {
      display: none;
    }

    .legend-note, .socal-key-note {
      color: #475569;
      font-size: 11px;
      margin: 0 0 8px;
      max-width: 300px;
      white-space: normal;
    }

    .legend.panel-collapsed .legend-note,
    .legend.panel-collapsed #socalDraftKey {
      display: none;
    }

    .socal-key-title { font-size: 12px; margin: 10px 0 4px; }
    .legend-row small { color: #475569; display: block; white-space: normal; }
    .region-nav {
      background: rgba(255, 255, 255, 0.97); border: 1px solid #d6e0e7;
      border-radius: 10px; box-shadow: 0 8px 26px rgba(15, 35, 48, 0.16); padding: 7px;
    }
    .region-nav-label { color: #526876; font: 700 10px/1.2 system-ui, sans-serif; margin: 0 3px 5px; }
    .region-nav-buttons { display: flex; gap: 4px; }
    .region-nav button {
      background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px;
      color: #1e293b; cursor: pointer; font: 600 12px/1.2 system-ui, sans-serif;
      min-height: 32px; padding: 5px 9px;
    }
    .region-nav button[aria-pressed="true"] { background: #075f62; border-color: #075f62; color: #fff; }
    .region-nav button:disabled { cursor: wait; opacity: .55; }
    .region-nav .return-state { margin-top: 5px; width: 100%; }
    .region-nav-hint { color: #526876; font: 11px/1.35 system-ui, sans-serif; margin: 7px 3px 2px; max-width: 170px; }

    .sampled-layers {
      background: rgba(255, 255, 255, 0.97); border: 1px solid #d6e0e7;
      border-radius: 12px; box-shadow: 0 8px 26px rgba(15, 35, 48, 0.16);
      box-sizing: border-box; color: #172b38; font: 12px/1.4 system-ui, sans-serif;
      padding: 10px 12px; width: min(245px, calc(100vw - 24px));
    }
    .sampled-layers-title { color: #526876; font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .sampled-layers label { align-items: center; cursor: pointer; display: flex; font-size: 13px; font-weight: 700; gap: 8px; min-height: 30px; }
    .sampled-layers input { accent-color: #087b78; height: 16px; margin: 0; width: 16px; }
    .sampled-layers-note, .sampled-layers-status { color: #526876; font-size: 11px; margin: 4px 0 0; }
    .sampled-layers-status:empty { display: none; }
    .sampled-legend { color: #526876; font-size: 10px; margin-top: 7px; }
    .sampled-legend[hidden] { display: none; }
    .sampled-legend-ramp { background: linear-gradient(to right, #5803a4, #9e1c9b, #d25072, #f48b47, #fdc527); border-radius: 3px; height: 7px; margin: 3px 0; }
    .sampled-legend-range { display: flex; justify-content: space-between; }
    .sampled-layers :focus-visible, .legend :focus-visible, .region-nav :focus-visible { outline: 3px solid #199a9a; outline-offset: 2px; }

    .panel-toggle {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      color: #1e293b;
      cursor: pointer;
      flex: 0 0 auto;
      font: 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-width: 2.25rem;
      padding: 5px 7px;
    }

    .panel-toggle:hover {
      background: #e2e8f0;
    }

    .legend-row {
      align-items: center;
      display: grid;
      gap: 8px;
      grid-template-columns: 18px 1fr;
      font-size: 12px;
      margin: 5px 0;
      white-space: nowrap;
    }

    .legend-region-name,
    .popup-region-name {
      display: block;
    }

    .coordination-badge {
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      color: #334155;
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.2;
      margin-top: 3px;
      padding: 2px 5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .coordination-badge.official-new-england {
      background: #dff6f2;
      border-color: #99e6d9;
      color: #075e54;
    }

    .coordination-badge.official-local {
      background: #dff6f2;
      border-color: #99e6d9;
      color: #075e54;
    }

    .coordination-badge.coordinated-external {
      background: #e8efff;
      border-color: #bdd0ff;
      color: #1e3a8a;
    }

    .coordination-badge.political-boundaries {
      background: #f0e7ff;
      border-color: #d8bfff;
      color: #5b21b6;
    }

    .coordination-badge.proposed {
      background: #fff7ed;
      border-color: #fdba74;
      color: #9a3412;
    }

    .coordination-badge.extrapolated-external {
      background: #fff4dc;
      border-color: #f4cf86;
      color: #7c4a03;
    }

    .region-code {
      background: #eef2f7;
      border: 1px solid #d6dee8;
      border-radius: 4px;
      color: #0f172a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
      padding: 1px 4px;
      white-space: nowrap;
    }

    .region-hover-tooltip.leaflet-tooltip, .boundary-note-tooltip.leaflet-tooltip {
      background: rgba(255, 255, 255, 0.98); border: 1px solid #d6e0e7;
      border-radius: 10px; box-shadow: 0 8px 24px rgba(15, 35, 48, 0.18);
      box-sizing: border-box; color: #172b38; font: 12px/1.4 system-ui, sans-serif;
      max-width: calc(100vw - 24px); padding: 10px 12px; pointer-events: none;
      white-space: normal; width: 250px;
    }
    .region-hover-tooltip.leaflet-tooltip::before, .boundary-note-tooltip.leaflet-tooltip::before { display: none; }
    .region-hover-name { color: #102c3b; font-size: 13px; font-weight: 750; margin: 0 0 5px; }
    .boundary-note-text { color: #243c49; font-size: 12px; line-height: 1.4; }
    .boundary-note-hit { cursor: help; }
    .scope-title { color: #526876; display: block; font-size: 10px; font-weight: 700; letter-spacing: .05em; margin: 5px 0; text-transform: uppercase; }
    .scope-stack { align-items: center; display: flex; flex-wrap: wrap; gap: 4px; }
    .scope-separator { color: #81939d; font-size: 13px; }
    .scope-help { color: #526876; display: block; font-size: 11px; margin-top: 6px; }

    .swatch {
      border: 2px solid currentColor;
      border-radius: 3px;
      height: 12px;
      opacity: 0.85;
      width: 14px;
    }

    .swatch.extrapolated-external {
      background-image: repeating-linear-gradient(
        135deg,
        transparent 0,
        transparent 3px,
        currentColor 3px,
        currentColor 5px
      );
    }

    .swatch.proposed {
      background-image: repeating-linear-gradient(
        315deg,
        transparent 0,
        transparent 3px,
        currentColor 3px,
        currentColor 5px
      );
    }

    .swatch.proposed.draft {
      background-image: none;
      border-style: dashed;
    }

    .popup-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .popup-table {
      border-collapse: collapse;
      font-size: 12px;
    }

    .popup-table th {
      color: #536271;
      font-weight: 600;
      padding: 2px 8px 2px 0;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    .popup-table td {
      padding: 2px 0;
      vertical-align: top;
    }

    .region-list {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
    }

    .region-list li {
      align-items: center;
      display: grid;
      gap: 8px;
      grid-template-columns: 16px 1fr;
      margin: 5px 0;
    }

    .region-list strong {
      display: block;
      font-size: 13px;
    }

    .region-list span {
      color: #536271;
      display: block;
      font-size: 12px;
    }
    .region-list .scope-stack { display: flex; }
    .region-list .scope-separator { display: inline; color: #81939d; }
    .region-list .scope-title { font-size: 10px; }
    .region-list .scope-help { font-size: 11px; }

    .error {
      background: #fff3f0;
      border-left: 4px solid #c8372d;
      color: #43120e;
      font-size: 14px;
      left: 50%;
      max-width: 560px;
      padding: 12px 14px;
      position: fixed;
      top: 16px;
      transform: translateX(-50%);
      z-index: 1000;
    }

    @media (max-width: 700px) {
      .leaflet-right .leaflet-control,
      .leaflet-left .leaflet-control {
        margin-left: 8px;
        margin-right: 8px;
      }

      .leaflet-control-layers {
        max-width: calc(100vw - 24px);
      }

      .legend {
        max-height: min(48vh, 320px);
        max-width: calc(100vw - 24px);
      }

      .leaflet-popup-content { overflow-wrap: anywhere; }
      .region-list li { align-items: start; }
      .region-list li > div { min-width: 0; }
      .leaflet-bottom.leaflet-left { bottom: 22px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const palette = [
      "#0f766e",
      "#b91c1c",
      "#1d4ed8",
      "#b45309",
      "#6d28d9",
      "#047857",
      "#be123c",
      "#0369a1",
      "#a16207",
      "#7e22ce",
      "#15803d",
      "#c2410c",
      "#334155"
    ];
    const regionColors = new Map([
      ["norcal", "#6e6e6e"],
      ["sacramentofoothills", "#d61f1f"],
      ["sierranevada", "#7c3aed"],
      ["bayarea", "#6b1515"],
      ["centralcoast", "#2c3eb8"],
      ["centralvalley", "#3cb64a"],
      ["socal", "#f0c400"],
      ["california", "#4b5563"]
    ]);

    function colorFor(id) {
      return regionColors.get(id) || "#111827";
    }

    function regionId(properties, fallback = "") {
      return properties.id || properties.index || fallback;
    }

    function regionCode(properties) {
      return String(properties.proposed_code || regionId(properties) || properties.short_name || "").toLowerCase();
    }

    function titleCaseKind(kind) {
      return String(kind || "")
        .split("_")
        .filter(Boolean)
        .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
        .join(" ");
    }

    function regionTypeLabel(properties) {
      if (properties.region_type) {
        return properties.region_type;
      }
      return titleCaseKind(properties.kind);
    }

    function isPointFeature(feature) {
      const type = feature?.geometry?.type;
      return type === "Point" || type === "MultiPoint";
    }

    function layerHasPoints(data) {
      return (data.features || []).some(isPointFeature);
    }

    function coordinationStatus(properties) {
      return properties.coordination_status || "extrapolated_external";
    }

    function coordinationLabel(properties) {
      if (properties.coordination_label) {
        return properties.coordination_label;
      }
      return {
        official_new_england: "Official New England Mesh Region",
        official_local: "Official Local Region",
        political_boundaries: "Political Boundaries",
        proposed: "Proposed Region",
        coordinated_external: "Coordinated External Region",
        extrapolated_external: "Suggested External Region"
      }[coordinationStatus(properties)] || "Suggested External Region";
    }

    function coordinationClass(properties) {
      return coordinationStatus(properties).replaceAll("_", "-");
    }

    function swatchClass(properties) {
      return `swatch ${coordinationClass(properties)}${properties.draft ? " draft" : ""}`;
    }

    const defaultCenter = [37.166, -119.449];
    const defaultZoom = 6;

    function sharedViewFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const latParam = params.get("lat");
      const lngParam = params.get("lng");
      if (latParam === null || lngParam === null) {
        return null;
      }
      const lat = Number(latParam);
      const lng = Number(lngParam);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        return null;
      }
      if (lat < -90 || lat > 90 || lng < -180 || lng > 180) {
        return null;
      }
      const zoomParam = params.get("z");
      const zoom = zoomParam === null ? defaultZoom : Number(zoomParam);
      return {
        latlng: L.latLng(lat, lng),
        zoom: Number.isFinite(zoom) ? Math.min(19, Math.max(1, Math.round(zoom))) : defaultZoom,
      };
    }

    const initialSharedView = sharedViewFromUrl();
    const initialCenter = initialSharedView?.latlng || L.latLng(defaultCenter[0], defaultCenter[1]);
    const initialZoom = initialSharedView?.zoom || defaultZoom;
    // Leaflet requires setView to establish its initial center and zoom.
    const map = L.map("map", { minZoom: 1 }).setView(initialCenter, initialZoom, { animate: false });
    // Controls and popups should scroll themselves without zooming the map.
    L.DomEvent.disableScrollPropagation(map.getContainer().querySelector(".leaflet-control-container"));
    map.on("popupopen", event => L.DomEvent.disableScrollPropagation(event.popup.getElement()));
    const regionRecords = [];
    const subregionLayers = [];
    let socalLayer = null;
    let stateBounds = null;
    const initialViewParams = new URLSearchParams(window.location.search);
    const initialRegionView = initialViewParams.get("view");
    let regionView = ["proposal", "socal"].includes(initialRegionView) ? initialRegionView : "california";
    let coverageVisible = false;
    const regionPathPrefix = window.location.pathname.includes("/regions/") ? "" : "regions/";

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    const overlayControl = L.control.layers(null, null, {
      collapsed: false,
      sortLayers: true
    }).addTo(map);

    function installLayerActions() {
      const container = overlayControl.getContainer();
      if (!container || container.querySelector(".layer-actions")) {
        return;
      }
      const div = L.DomUtil.create("div", "layer-actions");
      container.insertBefore(div, container.firstChild);
      container.classList.add("panel-collapsed");
      div.innerHTML = `
        <span class="layer-actions-title">Layers</span>
        <button class="deselect-action" type="button">Deselect all</button>
        <button class="panel-toggle" type="button" aria-label="Open layers" aria-expanded="false">Layers</button>
      `;
      const toggle = div.querySelector(".panel-toggle");
      const deselect = div.querySelector(".deselect-action");
      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.on(toggle, "click", (event) => {
        L.DomEvent.stop(event);
        const collapsed = container.classList.toggle("panel-collapsed");
        toggle.textContent = collapsed ? "Layers" : "Hide layers";
        toggle.setAttribute("aria-label", collapsed ? "Open layers" : "Hide layers");
        toggle.setAttribute("aria-expanded", String(!collapsed));
      });
      L.DomEvent.on(deselect, "click", (event) => {
        L.DomEvent.stop(event);
        regionRecords.forEach(({layer}) => {
          if (map.hasLayer(layer)) {
            map.removeLayer(layer);
          }
        });
      });
    }
    installLayerActions();

    const regionNavigation = L.control({ position: "topleft" });
    regionNavigation.onAdd = () => {
      const div = L.DomUtil.create("div", "region-nav");
      div.hidden = true;
      div.innerHTML = `<p class="region-nav-label">Region map</p><div class="region-nav-buttons" role="group" aria-label="Region map view">
        <button type="button" data-view="california" aria-pressed="false" disabled>Original</button>
        <button type="button" data-view="proposal" aria-pressed="false" disabled>SoCal proposal</button>
      </div>
      <button type="button" class="return-state" hidden>← State view</button>
      <p class="region-nav-hint" hidden>Hover or tap the northern border for terrain notes.</p>`;
      L.DomEvent.disableClickPropagation(div);
      div.querySelectorAll("button[data-view]").forEach(button => {
        L.DomEvent.on(button, "click", (event) => {
          L.DomEvent.stop(event);
          const next = button.dataset.view;
          if (next === regionView) return;
          setRegionView(next, { fit: next === "proposal" || regionView === "socal" });
        });
      });
      L.DomEvent.on(div.querySelector(".return-state"), "click", (event) => {
        L.DomEvent.stop(event);
        setRegionView("proposal");
      });
      return div;
    };
    regionNavigation.addTo(map);

    const legend = L.control({ position: "bottomright" });
    legend.onAdd = () => {
      const div = L.DomUtil.create("div", "legend panel-collapsed");
      div.innerHTML = `
        <h2>
          <span data-map-title>Regions</span>
          <button class="panel-toggle" type="button" aria-expanded="false">Region key</button>
        </h2>
        <p class="legend-note" hidden>SoCal boundaries and codes are draft proposals for community review.</p>
        <div id="legendRows"></div>
        <section id="socalDraftKey" hidden aria-label="SoCal subregion key">
          <h3 class="socal-key-title">SoCal subregions · draft</h3>
          <p class="socal-key-note">Phone area codes are approximate hints, not region boundaries or routing aliases.</p>
          <div id="socalDraftRows"></div>
        </section>
      `;
      const toggle = div.querySelector(".panel-toggle");
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.on(toggle, "click", (event) => {
        L.DomEvent.stop(event);
        const collapsed = div.classList.toggle("panel-collapsed");
        toggle.textContent = collapsed ? "Region key" : "Hide key";
        toggle.setAttribute("aria-expanded", String(!collapsed));
      });
      return div;
    };
    legend.addTo(map);

    function setMapTitle(value) {
      const title = typeof value === "string" && value.trim() ? value.trim() : "Regions";
      document.title = title;
      document.querySelectorAll("[data-map-title]").forEach((element) => {
        element.textContent = title;
      });
    }

    function featureStyle(feature) {
      const id = regionId(feature.properties);
      const color = colorFor(id || "");
      const status = coordinationStatus(feature.properties || {});
      const isOfficial = status === "official_new_england" || status === "official_local";
      const isHatched = status === "extrapolated_external" || (status === "proposed" && !feature.properties.draft);
      const highlightSoCal = id === "socal" && regionView === "proposal";
      return {
        color,
        dashArray: status === "extrapolated_external" ? "6 5" : null,
        fillColor: isHatched ? `url(#hatch-${status}-${id})` : color,
        fillOpacity: coverageVisible ? (highlightSoCal ? 0.06 : 0.025) : (highlightSoCal ? 0.23 : (isHatched ? 0.18 : (isOfficial ? 0.18 : 0.09))),
        opacity: highlightSoCal ? 1 : (isOfficial ? 0.95 : (status === "proposed" && feature.properties.draft ? 0.85 : 0.48)),
        weight: highlightSoCal ? 4 : (id === "east" ? 2 : 3)
      };
    }

    function addHatchPattern(layer, properties) {
      const status = coordinationStatus(properties);
      if (status !== "extrapolated_external" && !(status === "proposed" && !properties.draft)) {
        return;
      }
      const id = regionId(properties);
      const patternId = `hatch-${status}-${id}`;
      const pathLayer = layer.getLayers()[0];
      const svg = pathLayer?._renderer?._container;
      if (!svg || svg.querySelector(`#${patternId}`)) {
        return;
      }

      const svgNamespace = "http://www.w3.org/2000/svg";
      const defs = svg.querySelector("defs") || svg.insertBefore(
        document.createElementNS(svgNamespace, "defs"),
        svg.firstChild
      );
      const pattern = document.createElementNS(svgNamespace, "pattern");
      pattern.setAttribute("id", patternId);
      pattern.setAttribute("width", "12");
      pattern.setAttribute("height", "12");
      pattern.setAttribute("patternUnits", "userSpaceOnUse");

      const background = document.createElementNS(svgNamespace, "rect");
      background.setAttribute("width", "12");
      background.setAttribute("height", "12");
      background.setAttribute("fill", colorFor(id));
      pattern.appendChild(background);

      const hatch = document.createElementNS(svgNamespace, "path");
      hatch.setAttribute(
        "d",
        status === "proposed"
          ? "M -3,3 L 3,-3 M 0,12 L 12,0 M 9,15 L 15,9"
          : "M -3,9 L 3,15 M 0,0 L 12,12 M 9,-3 L 15,3"
      );
      hatch.setAttribute("fill", "none");
      hatch.setAttribute("stroke", "#111827");
      hatch.setAttribute("stroke-opacity", "0.8");
      hatch.setAttribute("stroke-width", "1.5");
      pattern.appendChild(hatch);
      defs.appendChild(pattern);
    }

    function showError(message) {
      const div = document.createElement("div");
      div.className = "error";
      div.textContent = message;
      document.body.appendChild(div);
    }

    function fetchJson(url) {
      // Revalidate local map data so revised boundaries do not remain stale in
      // browser caches. Keep external GeoJSON requests unchanged for CORS.
      const sameOrigin = new URL(url, window.location.href).origin === window.location.origin;
      return fetch(url, sameOrigin ? { cache: "no-cache" } : undefined).then((response) => {
        if (!response.ok) {
          throw new Error(`${url}: HTTP ${response.status}`);
        }
        return response.json();
      });
    }

    function pointOnSegment(point, a, b) {
      const lengthSquared = (b[0] - a[0]) ** 2 + (b[1] - a[1]) ** 2;
      if (lengthSquared === 0) {
        return Math.abs(point[0] - a[0]) < 1e-10 && Math.abs(point[1] - a[1]) < 1e-10;
      }
      const cross = (point[1] - a[1]) * (b[0] - a[0]) - (point[0] - a[0]) * (b[1] - a[1]);
      if (Math.abs(cross) > 1e-10) {
        return false;
      }
      const dot = (point[0] - a[0]) * (b[0] - a[0]) + (point[1] - a[1]) * (b[1] - a[1]);
      if (dot < 0) {
        return false;
      }
      return dot <= lengthSquared;
    }

    function pointInRing(point, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const a = ring[i];
        const b = ring[j];
        if (pointOnSegment(point, a, b)) {
          return true;
        }
        const intersects = ((a[1] > point[1]) !== (b[1] > point[1]))
          && (point[0] < ((b[0] - a[0]) * (point[1] - a[1])) / (b[1] - a[1]) + a[0]);
        if (intersects) {
          inside = !inside;
        }
      }
      return inside;
    }

    function pointInPolygon(point, polygon) {
      if (!polygon.length || !pointInRing(point, polygon[0])) {
        return false;
      }
      return !polygon.slice(1).some((hole) => pointInRing(point, hole));
    }

    function pointInGeometry(point, geometry) {
      if (!geometry) {
        return false;
      }
      if (geometry.type === "Polygon") {
        return pointInPolygon(point, geometry.coordinates);
      }
      if (geometry.type === "MultiPolygon") {
        return geometry.coordinates.some((polygon) => pointInPolygon(point, polygon));
      }
      if (geometry.type === "GeometryCollection") {
        return geometry.geometries.some((child) => pointInGeometry(point, child));
      }
      return false;
    }

    function renderLegendRow(row, props, isSubregion) {
      const color = colorFor(regionId(props));
      const areaCodes = isSubregion && Array.isArray(props.area_code_hints)
        ? `<small>Area code hints: ${escapeHtml(props.area_code_hints.join(" / "))}</small>` : "";
      row.innerHTML = `
        <span class="${swatchClass(props)}" style="color: ${color}; background-color: ${color}33"></span>
        <span><code class="region-code">${escapeHtml(regionCode(props))}</code> - ${escapeHtml(props.name)}${coordinationStatus(props) === "proposed" ? " (draft)" : ""}${areaCodes}</span>
      `;
    }

    function applyRegionVersion(view) {
      regionRecords.forEach(record => {
        if (record.proposalOnly && view === "california") {
          if (record.currentView !== view) {
            record.proposalVisible = map.hasLayer(record.layer);
            if (record.proposalVisible) map.removeLayer(record.layer);
            overlayControl.removeLayer(record.layer);
            if (record.legendRow) record.legendRow.hidden = true;
          }
          record.currentView = view;
          return;
        }
        if (record.proposalOnly && record.currentView === "california") {
          const props = record.proposal.data.features?.[0]?.properties || record.proposal.entry;
          overlayControl.addOverlay(record.layer, `${escapeHtml(regionCode(record.points ? record.proposal.entry : props))} - ${escapeHtml(record.points ? record.proposal.entry.name : props.name)}`);
          if (record.proposalVisible) {
            record.layer.addTo(map);
            if (!record.points) addHatchPattern(record.layer, props);
          }
          if (record.legendRow) record.legendRow.hidden = false;
        }
        record.currentView = view;
        const variant = view === "california" && record.original ? record.original : record.proposal;
        if (record.active !== variant) {
          record.layer.clearLayers();
          record.layer.addData(variant.data);
          record.active = variant;
          const props = variant.data.features?.[0]?.properties || variant.entry;
          if (!record.isSubregion) {
            overlayControl.removeLayer(record.layer);
            overlayControl.addOverlay(record.layer, `${escapeHtml(regionCode(record.points ? variant.entry : props))} - ${escapeHtml(record.points ? variant.entry.name : props.name)}`);
          }
          if (record.legendRow) renderLegendRow(record.legendRow, props, record.isSubregion);
          if (!record.points && map.hasLayer(record.layer)) addHatchPattern(record.layer, props);
        }
      });
    }

    function setRegionView(next, { fit = true, updateUrl = true } = {}) {
      if (!socalLayer || !subregionLayers.length || !["california", "proposal", "socal"].includes(next)) return;
      clearRegionHover();
      const changed = next !== regionView;
      regionView = next;
      const isSoCal = next === "socal";
      if (changed) applyRegionVersion(next);
      regionRecords.forEach(({layer}) => layer.setStyle(featureStyle));
      subregionLayers.forEach(({ layer, properties }) => {
        if (isSoCal && !map.hasLayer(layer)) {
          layer.addTo(map);
          addHatchPattern(layer, properties);
        } else if (!isSoCal && map.hasLayer(layer)) {
          map.removeLayer(layer);
        }
      });
      document.getElementById("socalDraftKey").hidden = !isSoCal;
      legend.getContainer().querySelector(".legend-note").hidden = next === "california";
      const navigation = regionNavigation.getContainer();
      navigation.querySelectorAll("button[data-view]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.view === (isSoCal ? "proposal" : next)));
      });
      navigation.querySelector(".return-state").hidden = !isSoCal;
      updateNorthernBoundaryNotes();
      map.closePopup();
      if (fit) {
        const bounds = isSoCal ? socalLayer.getBounds() : stateBounds;
        if (bounds?.isValid()) map.fitBounds(bounds.pad(0.04), { animate: false });
      }
      if (updateUrl) {
        const url = new URL(window.location.href);
        if (next === "california") url.searchParams.delete("view");
        else url.searchParams.set("view", next);
        ["lat", "lng", "z"].forEach((key) => url.searchParams.delete(key));
        window.history.replaceState(null, "", url);
      }
    }

    function formatCoordinate(value) {
      return Number(value).toFixed(6);
    }

    function formatShareCoordinate(value) {
      return Number(value).toFixed(5);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function scopeStackMarkup(properties) {
      const names = typeof properties.region_chain === "string"
        ? properties.region_chain.trim().split(/\s+/).filter(Boolean) : [];
      if (!names.length) return `<span class="scope-help">No region hierarchy is available for this region.</span>`;
      const title = properties.draft || coordinationStatus(properties) === "proposed"
        ? "Proposed region hierarchy" : "Mapped region hierarchy";
      return `<span class="scope-title">${title}</span><span class="scope-stack">${names
        .map(name => `<code class="region-code">${escapeHtml(name)}</code>`)
        .join('<span class="scope-separator" aria-hidden="true">›</span>')}</span>
        <span class="scope-help">When sending, select one level as the scope.</span>`;
    }

    // Polygons remain non-interactive so the existing map click and outside-
    // SoCal navigation continue to work. Hit-test only currently visible layers.
    const regionHoverTooltip = L.tooltip({direction: "auto", offset: [14, 0], opacity: 1, className: "region-hover-tooltip"});
    let hoveredRegion = null;
    let hoveredFeature = null;
    let hoverFrame = 0;
    let pendingHover = null;

    function clearRegionHover() {
      if (hoverFrame) cancelAnimationFrame(hoverFrame);
      hoverFrame = 0;
      pendingHover = null;
      if (hoveredRegion && map.hasLayer(hoveredRegion.layer)) hoveredRegion.layer.setStyle(featureStyle);
      hoveredRegion = null;
      hoveredFeature = null;
      if (map.hasLayer(regionHoverTooltip)) map.removeLayer(regionHoverTooltip);
    }

    function visibleRegionAt(latlng) {
      const point = [latlng.lng, latlng.lat];
      let best = null;
      regionRecords.forEach(record => {
        if (record.points || !map.hasLayer(record.layer) || (record.isSubregion && regionView !== "socal")) return;
        const bounds = record.layer.getBounds();
        if (!bounds.isValid() || !bounds.contains(latlng)) return;
        for (const feature of record.active.data.features || []) {
          if (isPointFeature(feature) || !pointInGeometry(point, feature.geometry)) continue;
          const score = (record.isSubregion ? 100 : 0) + regionChainDepth(feature.properties);
          if (!best || score > best.score) best = {record, feature, score};
        }
      });
      return best;
    }

    map.on("mousemove", event => {
      const source = event.originalEvent;
      if (source?.buttons || source?.pointerType === "touch" || source?.target?.closest?.(".leaflet-control, .leaflet-popup, .boundary-note-hit")) {
        clearRegionHover();
        return;
      }
      pendingHover = event.latlng;
      if (hoverFrame) return;
      hoverFrame = requestAnimationFrame(() => {
        hoverFrame = 0;
        const latlng = pendingHover;
        if (!latlng) return;
        const hit = visibleRegionAt(latlng);
        if (!hit) { clearRegionHover(); return; }
        if (hoveredRegion !== hit.record || hoveredFeature !== hit.feature) {
          if (hoveredRegion && map.hasLayer(hoveredRegion.layer)) hoveredRegion.layer.setStyle(featureStyle);
          hoveredRegion = hit.record;
          hoveredFeature = hit.feature;
          hoveredRegion.layer.setStyle(feature => ({...featureStyle(feature), weight: 4, opacity: 1,
            fillOpacity: coverageVisible ? .08 : .24}));
          const exploreHint = regionView !== "socal" && regionId(hit.feature.properties) === "socal"
            ? `<span class="scope-help"><strong>${regionView === "proposal" ? "Click to explore subregions" : "Click to view SoCal proposal"}</strong></span>` : "";
          regionHoverTooltip.setContent(`<div class="region-hover-name">${escapeHtml(hit.feature.properties.name || "Region")}</div>${scopeStackMarkup(hit.feature.properties)}${exploreHint}`);
        }
        regionHoverTooltip.setLatLng(latlng);
        if (!map.hasLayer(regionHoverTooltip)) regionHoverTooltip.addTo(map);
      });
    });
    map.on("movestart zoomstart popupopen overlayremove", clearRegionHover);
    L.DomEvent.on(map.getContainer(), "mouseleave", clearRegionHover);

    // These display-only notes trace the proposal's shared northern edges.
    // Their separate, transparent hit lines leave the actual region geometry intact.
    let northernBoundaryNotes = null;
    let activeBoundaryHighlight = null;
    let activeBoundaryHit = null;

    function clearBoundaryHighlight() {
      if (!activeBoundaryHighlight) return;
      activeBoundaryHighlight.forEach(layer => map.removeLayer(layer));
      activeBoundaryHighlight = null;
    }

    function clearBoundaryInteraction(hit = activeBoundaryHit) {
      if (!hit || hit !== activeBoundaryHit) return;
      activeBoundaryHit = null;
      hit.closeTooltip();
      clearBoundaryHighlight();
    }

    function updateNorthernBoundaryNotes() {
      const show = regionView !== "california" && !!socalLayer && map.hasLayer(socalLayer) && !!northernBoundaryNotes;
      const hint = regionNavigation.getContainer().querySelector(".region-nav-hint");
      hint.hidden = !show;
      if (!northernBoundaryNotes) return;
      if (show && !map.hasLayer(northernBoundaryNotes)) northernBoundaryNotes.addTo(map);
      if (!show && map.hasLayer(northernBoundaryNotes)) {
        clearBoundaryInteraction();
        northernBoundaryNotes.eachLayer(layer => layer.closePopup());
        map.removeLayer(northernBoundaryNotes);
      }
    }

    function installNorthernBoundaryNotes(data) {
      const pane = map.createPane("northernBoundaryNotes");
      pane.style.zIndex = 625;
      northernBoundaryNotes = L.layerGroup();
      (data.features || []).forEach(feature => {
        if (feature.geometry?.type !== "LineString") return;
        const points = feature.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
        const properties = feature.properties || {};
        const title = escapeHtml(properties.title || "Proposed boundary");
        const description = escapeHtml(properties.description || "");
        const content = `<div class="region-hover-name">${title}</div>
          <div class="boundary-note-text">${description}</div>
          <span class="scope-help">Terrain guide; RF viewsheds not verified.</span>`;
        const lineOptions = { pane: "northernBoundaryNotes", interactive: false, lineCap: "round" };
        const halo = L.polyline(points, { ...lineOptions, color: "#fff", opacity: 0.95, weight: 10 });
        const highlight = L.polyline(points, { ...lineOptions, color: "#087a78", opacity: 1, weight: 5 });
        const hit = L.polyline(points, { pane: "northernBoundaryNotes", className: "boundary-note-hit",
          color: "#000", opacity: 0, weight: 18, bubblingMouseEvents: false });
        const showHighlight = () => {
          clearRegionHover();
          if (activeBoundaryHit && activeBoundaryHit !== hit) clearBoundaryInteraction();
          activeBoundaryHit = hit;
          clearBoundaryHighlight();
          halo.addTo(map);
          highlight.addTo(map);
          activeBoundaryHighlight = [halo, highlight];
        };
        hit.bindTooltip(content, { direction: "bottom", offset: [0, 16], sticky: true, opacity: 1, className: "boundary-note-tooltip" });
        hit.bindPopup(content, { maxWidth: 280 });
        hit.on("mouseover", showHighlight);
        hit.on("mouseout", () => {
          if (document.activeElement !== hit.getElement()) clearBoundaryInteraction(hit);
        });
        hit.on("click", () => { showHighlight(); hit.closeTooltip(); });
        hit.on("popupclose", () => clearBoundaryInteraction(hit));
        hit.on("add", () => {
          const element = hit.getElement();
          element.setAttribute("tabindex", "0");
          element.setAttribute("role", "button");
          element.setAttribute("aria-label", `${properties.title}. ${properties.description} Terrain guide; RF viewsheds not verified.`);
          if (element.hasAttribute("data-note-key-bound")) return;
          element.setAttribute("data-note-key-bound", "true");
          L.DomEvent.on(element, "focus", () => { showHighlight(); hit.openTooltip(hit.getCenter()); });
          L.DomEvent.on(element, "blur", () => clearBoundaryInteraction(hit));
          L.DomEvent.on(element, "keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              L.DomEvent.stop(event);
              showHighlight();
              hit.openPopup(hit.getCenter());
            }
          });
        });
        northernBoundaryNotes.addLayer(hit);
      });
      updateNorthernBoundaryNotes();
    }

    map.on("movestart zoomstart", () => clearBoundaryInteraction());
    map.on("layeradd layerremove", event => {
      if (event.layer === socalLayer) updateNorthernBoundaryNotes();
    });

    // The compressed display layers contain only generalized coverage shapes
    // and reported path geometry. Both start off, independent of the map view.
    async function loadSampledLayer(filename) {
      const response = await fetch(`${regionPathPrefix}${filename}`);
      if (!response.ok) throw new Error("Sampled layer unavailable");
      let bytes = new Uint8Array(await response.arrayBuffer());
      if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
        if (!("DecompressionStream" in window)) throw new Error("This browser cannot open compressed layers");
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        bytes = new Uint8Array(await new Response(stream).arrayBuffer());
      }
      const data = JSON.parse(new TextDecoder().decode(bytes));
      if (data?.type !== "FeatureCollection" || !Array.isArray(data.features)) throw new Error("Invalid sampled layer");
      return data;
    }

    function installSampledLayers() {
      const control = L.control({position: "topleft"});
      const colors = ["#5803a4", "#9e1c9b", "#d25072", "#f48b47", "#fdc527"];
      const styles = {
        coverage: feature => ({stroke: false, fill: true,
          fillColor: colors[Number(feature.properties?.band) - 1] || colors[0],
          fillOpacity: Number(feature.properties?.band) === 1 ? .5 : .75}),
        topology: {color: "#315b9a", weight: 1, opacity: .66}
      };
      control.onAdd = () => {
        const div = L.DomUtil.create("section", "sampled-layers");
        div.innerHTML = `<div class="sampled-layers-title">Sampled layers</div>
          <label><input type="checkbox" data-sample="coverage"><span>Sampled Coverage</span></label>
          <label><input type="checkbox" data-sample="topology"><span>Sampled Topology</span></label>
          <div class="sampled-legend" hidden><div>Reception margin</div><div class="sampled-legend-ramp"></div>
            <div class="sampled-legend-range"><span>−6 dB</span><span>+18 dB or more</span></div></div>
          <p class="sampled-layers-note">927.875 MHz sample. Coverage is generalized; reported paths may not be direct RF links.</p>
          <p class="sampled-layers-status" role="status" aria-live="polite"></p>`;
        const legend = div.querySelector(".sampled-legend");
        const status = div.querySelector(".sampled-layers-status");
        div.querySelectorAll("input[data-sample]").forEach(input => {
          const kind = input.dataset.sample;
          const paneName = `sampled-${kind}`;
          const pane = map.createPane(paneName);
          pane.style.zIndex = kind === "coverage" ? "310" : "410";
          pane.style.pointerEvents = "none";
          let layer, pending;
          input.addEventListener("change", async () => {
            if (input.checked) {
              try {
                pending ||= loadSampledLayer(`sampled-${kind}.geojson.gz`)
                  .then(data => layer = L.geoJSON(data, {renderer: L.canvas({pane: paneName}),
                    interactive: false, style: styles[kind]}))
                  .catch(error => { pending = null; throw error; });
                await pending;
                if (!input.checked) return;
                layer.addTo(map);
                status.textContent = "";
              } catch {
                input.checked = false;
                status.textContent = `${input.closest("label").textContent.trim()} is unavailable.`;
              }
            } else if (layer) map.removeLayer(layer);
            if (kind === "coverage") {
              clearRegionHover();
              coverageVisible = !!layer && map.hasLayer(layer);
              legend.hidden = !coverageVisible;
              regionRecords.forEach(({layer}) => layer.setStyle(featureStyle));
            }
          });
        });
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      control.addTo(map);

      // Ignore legacy layer query parameters so a shared link starts with both off.
      const url = new URL(window.location.href);
      ["coverage", "coverageView", "coverageOpacity", "topology"].forEach(key => url.searchParams.delete(key));
      window.history.replaceState(null, "", url);
    }
    installSampledLayers();

    function locationLabel(address) {
      if (!address) {
        return "";
      }
      const town = address.city
        || address.town
        || address.village
        || address.hamlet
        || address.municipality
        || address.suburb
        || address.neighbourhood;
      const county = address.county;
      const state = address.state_code || address.state;
      return [town, county, state].filter(Boolean).join(", ");
    }

    function reverseGeocode(latlng) {
      const params = new URLSearchParams({
        format: "jsonv2",
        lat: latlng.lat,
        lon: latlng.lng,
        zoom: "18",
        addressdetails: "1",
      });
      return fetchJson(`https://nominatim.openstreetmap.org/reverse?${params}`)
        .then((data) => locationLabel(data.address) || data.display_name || "");
    }

    function regionListPopup(latlng, matches, place = "Looking up...") {
      const coordinate = `${formatCoordinate(latlng.lat)}, ${formatCoordinate(latlng.lng)}`;
      const placeRow = `<tr><th>Place</th><td>${escapeHtml(place)}</td></tr>`;
      if (!matches.length) {
        return `
          <div class="popup-title">No MeshCore region</div>
          <table class="popup-table">
            <tr><th>GPS</th><td>${coordinate}</td></tr>
            ${placeRow}
          </table>
        `;
      }

      return `
        <div class="popup-title">${matches.length} MeshCore region${matches.length === 1 ? "" : "s"}</div>
        <table class="popup-table">
          <tr><th>GPS</th><td>${coordinate}</td></tr>
          ${placeRow}
        </table>
        <ul class="region-list">
          ${matches.map((props) => {
            const id = regionId(props);
            const color = colorFor(id);
            const coordinator = props.coordinator
              ? `<span>Coordinator: ${escapeHtml(props.coordinator)}</span>`
              : "";
            const chain = props.region_chain ? scopeStackMarkup(props) : "";
            const notes = props.notes
              ? `<span>${escapeHtml(props.notes)}</span>`
              : "";
            const areaCodes = Array.isArray(props.area_code_hints) && props.area_code_hints.length
              ? `<span>Phone area code hints: ${escapeHtml(props.area_code_hints.join(" / "))} (approximate, not routing)</span>`
              : "";
            return `
              <li>
                <span class="${swatchClass(props)}" style="color: ${color}; background-color: ${color}33"></span>
                <div>
                  <strong class="popup-region-name"><code class="region-code">${escapeHtml(regionCode(props))}</code>${props.optional ? " (Optional)" : ""} - ${escapeHtml(props.name)}</strong>
                  <span>${escapeHtml(regionTypeLabel(props))}</span>
                  <span class="coordination-badge ${coordinationClass(props)}">${escapeHtml(coordinationLabel(props))}</span>
                  ${chain}
                  ${areaCodes}
                  ${notes}
                  ${coordinator}
                </div>
              </li>
            `;
          }).join("")}
        </ul>
      `;
    }

    function queryRegionsAt(latlng) {
      const point = [latlng.lng, latlng.lat];
      return regionRecords
        .filter(record => !(record.proposalOnly && regionView === "california"))
        .flatMap(({active, layer}) => (active.data.features || [])
          .filter(feature => (!feature.properties.legacy_reference || map.hasLayer(layer))
            && (feature.properties.overlay_group !== "subregion" || regionView === "socal")
            && !isPointFeature(feature) && pointInGeometry(point, feature.geometry)))
        .map((feature) => feature.properties)
        .sort((a, b) => {
          if (Boolean(a.optional) !== Boolean(b.optional)) {
            return a.optional ? 1 : -1;
          }
          const depthA = regionChainDepth(a);
          const depthB = regionChainDepth(b);
          if (depthA !== depthB) return depthB - depthA;
          return String(a.short_name).localeCompare(String(b.short_name));
        });
    }

    function regionChainDepth(properties) {
      const chain = String(properties.region_chain || "").trim();
      return chain ? chain.split(/\s+/).length : 0;
    }

    function localAreaPopup(properties) {
      const chain = properties.region_chain
        ? `<tr><th>Scopes</th><td>${scopeStackMarkup(properties)}</td></tr>`
        : "";
      const counties = properties.counties
        ? `<tr><th>County</th><td>${escapeHtml(properties.counties)}</td></tr>`
        : "";
      const notes = properties.notes
        ? `<tr><th>Notes</th><td>${escapeHtml(properties.notes)}</td></tr>`
        : "";
      return `
        <div class="popup-title"><code class="region-code">${regionCode(properties)}</code> - ${escapeHtml(properties.name || "")}</div>
        <table class="popup-table">
          <tr><th>Type</th><td>${escapeHtml(regionTypeLabel(properties))}</td></tr>
          ${chain}
          ${counties}
          ${notes}
        </table>
      `;
    }

    function updateShareUrl(latlng) {
      const url = new URL(window.location.href);
      url.searchParams.set("lat", formatShareCoordinate(latlng.lat));
      url.searchParams.set("lng", formatShareCoordinate(latlng.lng));
      url.searchParams.set("z", String(map.getZoom()));
      window.history.replaceState(null, "", url);
    }

    function openRegionPopup(latlng, updateUrl = false) {
      if (updateUrl) {
        updateShareUrl(latlng);
      }
      const matches = queryRegionsAt(latlng);
      const narrow = window.matchMedia("(max-width: 700px)").matches;
      const maxWidth = narrow ? Math.min(320, Math.max(180, window.innerWidth - 60)) : 420;
      const mapBounds = map.getContainer().getBoundingClientRect();
      const topControls = map.getContainer().querySelector(".leaflet-top.leaflet-left");
      const bottomControls = map.getContainer().querySelector(".leaflet-bottom.leaflet-left");
      const topPadding = narrow && topControls ? Math.ceil(topControls.getBoundingClientRect().bottom - mapBounds.top + 12) : 12;
      const bottomPadding = narrow && bottomControls ? Math.ceil(mapBounds.bottom - bottomControls.getBoundingClientRect().top + 12) : 12;
      const maxHeight = narrow
        ? Math.max(100, Math.min(Math.round(mapBounds.height * .4), mapBounds.height - topPadding - bottomPadding - 60))
        : Math.max(160, Math.min(450, mapBounds.height - 120));
      const popup = L.popup({ maxWidth, minWidth: narrow ? Math.min(280, maxWidth) : 320,
        maxHeight, autoPanPaddingTopLeft: L.point(12, topPadding),
        autoPanPaddingBottomRight: L.point(12, bottomPadding) })
        .setLatLng(latlng)
        .setContent(regionListPopup(latlng, matches))
        .openOn(map);

      reverseGeocode(latlng)
        .then((place) => {
          if (map.hasLayer(popup)) {
            popup.setContent(regionListPopup(latlng, matches, place || "Unknown"));
          }
        })
        .catch(() => {
          if (map.hasLayer(popup)) {
            popup.setContent(regionListPopup(latlng, matches, "Unavailable"));
          }
        });
    }

    map.on("click", (event) => {
      const point = [event.latlng.lng, event.latlng.lat];
      const inSoCal = socalLayer?.getLayers().some(layer => pointInGeometry(point, layer.feature.geometry));
      if (regionView === "socal" && socalLayer && !inSoCal) {
        setRegionView("proposal");
        return;
      }
      if (regionView !== "socal" && socalLayer && subregionLayers.length && map.hasLayer(socalLayer) && inSoCal) {
        setRegionView(regionView === "california" ? "proposal" : "socal");
        return;
      }
      openRegionPopup(event.latlng, true);
    });

    function prepareRegionData(entry, data) {
      const points = layerHasPoints(data);
      const { coordinator: _entryCoordinator, ...entryProperties } = entry;
      const features = (data.features || []).map((feature) => {
        const {
          coordination_status: _featureCoordinationStatus,
          coordination_label: _featureCoordinationLabel,
          coordination_notes: _featureCoordinationNotes,
          ...featureProperties
        } = feature.properties || {};
        const properties = points ? {
          ...entryProperties,
          ...featureProperties,
          coordination_status: featureProperties.coordination_status || entry.coordination_status || "official_local",
        } : {
          ...featureProperties,
          ...entryProperties,
          id: entry.id,
          coordination_status: entry.coordination_status || "extrapolated_external",
        };
        return {...feature, properties};
      });
      return { entry, data: {...data, features} };
    }

    fetchJson(`${regionPathPrefix}index.json`)
      .then(async (manifest) => {
        const index = manifest?.regions;
        if (!Array.isArray(index)) {
          throw new Error(`${regionPathPrefix}index.json must contain a regions array`);
        }
        const comparisonAvailable = index.some(entry => entry.overlay_group === "subregion");
        const snapshot = comparisonAvailable ? await fetchJson(`${regionPathPrefix}original-regions.json`) : {regions: []};
        if (!Array.isArray(snapshot?.regions)) {
          throw new Error("The original-region snapshot is unavailable");
        }
        const originals = new Map(snapshot.regions.map(item => [item.entry?.id, item]));
        if (comparisonAvailable && ["socal", "centralcoast", "centralvalley", "sierranevada"]
          .some(id => index.some(entry => entry.id === id) && !originals.has(id))) {
          throw new Error("The original-region snapshot is incomplete");
        }
        setMapTitle(manifest.title);
        index.forEach((entry, indexPosition) => {
          if (entry.color) {
            regionColors.set(entry.id, entry.color);
          } else if (!regionColors.has(entry.id)) {
            regionColors.set(entry.id, palette[indexPosition % palette.length]);
          }
        });
        return Promise.all(index.map((entry) => {
          if (!entry.file) {
            throw new Error("Every index entry must include a file property");
          }
          if (!entry.id) {
            throw new Error("Every index entry must include an id property");
          }
          // `file` may be a local filename or an externally hosted GeoJSON URL.
          // Example external index entry (keep index.json valid JSON, so do not add
          // this comment there):
          // { "id": "ny", "name": "New York", "short_name": "NY", "coordination_status": "coordinated_external", "coordination_label": "Coordinated External Region", "file": "https://nyme.sh/regions/ny.geojson" }
          const regionFileUrl = new URL(
            entry.file,
            new URL(regionPathPrefix, window.location.href)
          ).href;
          return fetchJson(regionFileUrl).then((data) => ({
            entry,
            data
          }));
        })).then(response => ({response, originals}));
      })
      .then(({response, originals}) => {
        const bounds = L.latLngBounds();
        const legendRows = document.getElementById("legendRows");
        const socalDraftRows = document.getElementById("socalDraftRows");

        response.forEach(({ entry, data: proposalData }) => {
          const proposal = prepareRegionData(entry, proposalData);
          const savedOriginal = originals.get(entry.id);
          const original = savedOriginal ? prepareRegionData(savedOriginal.entry, savedOriginal.data || proposalData) : null;
          const active = regionView === "california" && original ? original : proposal;
          const data = active.data;
          const points = layerHasPoints(data);
          const isSubregion = entry.overlay_group === "subregion";
          const proposalOnly = originals.size > 0 && !original && !isSubregion;
          const layer = L.geoJSON(data, {
            interactive: points,
            style: featureStyle,
            pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
              radius: 5,
              color: colorFor(regionId(feature.properties, entry.id)),
              fillColor: colorFor(regionId(feature.properties, entry.id)),
              fillOpacity: 0.9,
              weight: 1,
              opacity: 1
            }),
            onEachFeature: points
              ? (feature, featureLayer) => {
                featureLayer.bindPopup(localAreaPopup(feature.properties), {
                  maxWidth: 420,
                  minWidth: 280
                });
              }
              : undefined
          });
          const props = data.features?.[0]?.properties || active.entry;
          const id = regionId(points ? active.entry : props, entry.id);
          const record = {proposal, original, active, layer, points, isSubregion, proposalOnly,
            currentView: regionView, proposalVisible: entry.visible !== false, legendRow: null};
          regionRecords.push(record);
          if (id === "socal") socalLayer = layer;
          if (isSubregion) subregionLayers.push({ layer, properties: props });
          else if (!(proposalOnly && regionView === "california")) overlayControl.addOverlay(layer, `${escapeHtml(regionCode(points ? active.entry : props))} - ${escapeHtml(points ? active.entry.name : props.name)}`);
          if (!isSubregion && !(proposalOnly && regionView === "california") && active.entry.visible !== false) {
            layer.addTo(map);
            if (!points) {
              addHatchPattern(layer, props);
            }
          }
          const layerBounds = layer.getBounds();
          if (layerBounds.isValid() && !(proposalOnly && regionView === "california")) {
            bounds.extend(layerBounds);
          }

          if ((isSubregion || entry.legend !== false) && !points) {
            const row = document.createElement("div");
            row.className = "legend-row";
            renderLegendRow(row, props, isSubregion);
            row.hidden = proposalOnly && regionView === "california";
            record.legendRow = row;
            (isSubregion ? socalDraftRows : legendRows).appendChild(row);
          }
        });

        stateBounds = bounds;
        const navButtons = regionNavigation.getContainer().querySelectorAll("button[data-view]");
        const hasSoCalDraft = !!socalLayer && subregionLayers.length > 0;
        navButtons.forEach(button => {
          button.disabled = !hasSoCalDraft;
          button.setAttribute("aria-pressed", String(button.dataset.view === (regionView === "socal" ? "proposal" : regionView)));
        });
        regionNavigation.getContainer().hidden = !hasSoCalDraft;
        legend.getContainer().querySelector(".legend-note").hidden = !hasSoCalDraft || regionView === "california";
        if (hasSoCalDraft) {
          fetchJson(`${regionPathPrefix}socal-boundary-notes.geojson`)
            .then(installNorthernBoundaryNotes)
            .catch(error => console.warn("Northern boundary notes are unavailable:", error));
        }
        map.invalidateSize();
        const sharedSoCal = new URLSearchParams(window.location.search).get("view") === "socal" && !!socalLayer && subregionLayers.length > 0;
        if (sharedSoCal) setRegionView("socal", { fit: !initialSharedView, updateUrl: false });
        if (initialSharedView) {
          map.setView(initialSharedView.latlng, initialSharedView.zoom);
          openRegionPopup(initialSharedView.latlng);
        } else if (!sharedSoCal && bounds.isValid()) {
          map.fitBounds(bounds.pad(0.04), { animate: false });
        } else if (!sharedSoCal) {
          map.setView(defaultCenter, defaultZoom, { animate: false });
        }
      })
      .catch((error) => {
        showError(`Could not load the GeoJSON manifest or region files: ${error.message}. Serve this folder over HTTP instead of opening the HTML file directly.`);
      });
  </script>
</body>
</html>
