<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WC Mesh region maps</title>
  <meta
    name="description"
    content="Combined list of MeshCore region scopes for California, the Pacific Northwest, and the Intermountain West."
  >
  <style>
    :root {
      color-scheme: light;
      --text: #16202a;
      --muted: #536271;
      --border: #d6dee8;
      --bg: #f6f8fb;
      --card: #fff;
      --code: #0f766e;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      margin: 0 auto;
      max-width: 980px;
      padding: 3.5rem 1.5rem 5rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.05;
      margin: 0 0 0.8rem;
    }

    h2 {
      font-size: 1.35rem;
      margin: 0;
    }

    h3 {
      font-size: 0.95rem;
      margin: 1.1rem 0 0.35rem;
    }

    .lead {
      color: var(--muted);
      font-size: 1.12rem;
      max-width: 42rem;
    }

    .maps {
      display: grid;
      gap: 0.8rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin: 1.5rem 0 2rem;
    }

    a.map-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: inherit;
      display: block;
      padding: 1rem 1.05rem;
      text-decoration: none;
    }

    a.map-card strong {
      display: block;
      margin-bottom: 0.25rem;
    }

    a.map-card span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    section.region-map {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 0 0 1rem;
      padding: 1.1rem 1.2rem 1.25rem;
    }

    section.region-map > p {
      color: var(--muted);
      margin: 0.4rem 0 0.2rem;
    }

    .group-note {
      color: var(--muted);
      font-size: 0.88rem;
      margin: 0.15rem 0 0.2rem;
    }

    ul.scopes {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    ul.scopes a {
      align-items: baseline;
      border-radius: 6px;
      color: inherit;
      display: flex;
      gap: 0.7rem;
      padding: 0.18rem 0.4rem;
      text-decoration: none;
    }

    ul.scopes a:hover {
      background: #eef3f8;
    }

    code {
      color: var(--code);
      font-size: 0.86rem;
      min-width: 9.5rem;
    }

    .kind {
      color: var(--muted);
      font-size: 0.8rem;
      margin-left: auto;
    }

    .error { color: #9f1239; }

    @media (max-width: 800px) {
      main { padding-top: 2.2rem; }
      .maps { grid-template-columns: 1fr; }
      code { min-width: 6.5rem; }
      .kind { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>WC Mesh region maps</h1>
    <p class="lead">
      Every scope on this site, across California, the Pacific Northwest, and the Intermountain West.
      Open a map to see the boundaries.
    </p>
    <div class="maps" id="maps"></div>
    <div id="directory"><p class="lead">Loading the region list…</p></div>
  </main>
  <script>
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function scopeHref(map, row) {
      return `${map.href}/#${encodeURIComponent(row.id)}`;
    }

    function render(catalog) {
      document.getElementById("maps").innerHTML = catalog.maps.map((map) => `
        <a class="map-card" href="${escapeHtml(map.href)}">
          <strong>${escapeHtml(map.title)}</strong>
          <span>Open the map</span>
        </a>
      `).join("");

      document.getElementById("directory").innerHTML = catalog.maps.map((map) => `
        <section class="region-map" id="${escapeHtml(map.id)}">
          <h2><a href="${escapeHtml(map.href)}">${escapeHtml(map.title)}</a></h2>
          ${map.summary || map.source ? `<p>${map.summary ? escapeHtml(map.summary) : ""}${map.source ? `${map.summary ? " " : ""}<a href="${escapeHtml(map.source)}">Source tree</a>.` : ""}</p>` : ""}
          ${map.groups.map((group) => `
            <h3>${escapeHtml(group.title)}</h3>
            ${group.note ? `<p class="group-note">${escapeHtml(group.note)}</p>` : ""}
            <ul class="scopes">
              ${group.rows.map((row) => `
                <li>
                  <a href="${escapeHtml(scopeHref(map, row))}" style="padding-left:${0.4 + (row.depth || 0) * 0.85}rem">
                    <code>${escapeHtml(row.code)}</code>
                    <span>${escapeHtml(row.name)}</span>
                    <span class="kind">${escapeHtml(row.kind || "")}</span>
                  </a>
                </li>
              `).join("")}
            </ul>
          `).join("")}
        </section>
      `).join("");
    }

    fetch("/catalog.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`${response.status}`);
        return response.json();
      })
      .then(render)
      .catch((error) => {
        document.getElementById("directory").innerHTML = `<p class="error">Could not load the region list (${escapeHtml(error.message)}).</p>`;
      });
  </script>
</body>
</html>
